[build-system]
# torch must match the runtime range below: build isolation resolves this list on its
# own, and a mismatch links the C++ extensions against the wrong libtorch.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = ["setuptools>=77", "torch>=2.11,<2.14", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken"
# Single source of truth: python/freetoken/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Local MoE-offload LLM inference runtime with OpenAI- and Anthropic-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FlashML Team" }]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: AMD ROCm",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "apache-tvm-ffi==0.1.13.post3", # pin it
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    # slot_cache: the device-side LRU admission kernel behind the MoE expert cache.
    "flashlib==0.3.0", # pin it
    "gguf>=0.19,<1",
    "huggingface_hub>=1.5,<2",
    "msgpack>=1.1,<2",
    "modelscope>=1.37,<2",
    # ceiling: numba (via flashlib) needs numpy<2.5
    "numpy>=2.0,<2.5",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    # OpenAI-compatible image inputs decode through Pillow before being packed
    # into Gemma4's patch-major CPU tensors for the tokenizer-to-engine wire.
    "pillow>=10,<13",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    # Torch and Triton are accelerator ABI dependencies. They intentionally
    # live in the mutually exclusive CUDA and ROCm extras below.
    "tqdm>=4.66,<5",
    "transformers>=5.16,<5.17",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/FlashML-org/FreeToken"
Repository = "https://github.com/FlashML-org/FreeToken"
Issues = "https://github.com/FlashML-org/FreeToken/issues"

[project.scripts]
ft = "freetoken.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0", "tomli>=2.0,<3; python_version < '3.11'"]
# Select exactly one accelerator ABI. PyTorch's wheel backend is not part of
# standard package metadata, so ``cuda`` and ``rocm`` deliberately make the
# choice explicit for uv. The documented pip flow provisions the same matched
# wheels from the chosen PyTorch index before the editable source build.
cuda = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "triton==3.6.0; platform_system == 'Linux'",
    "flashinfer-python[cu13]>=0.6,<0.7",
    "sglang-kernel==0.4.5",
]
rocm = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "pytorch-triton-rocm>=3.5.1; sys_platform == 'linux'",
    "triton-rocm>=3.6.0; sys_platform == 'linux'",
]
# Native fused-kernel packages. Without them the runtime falls back to the pure-Triton
# kernels in freetoken.kernel.triton (and the 'triton' attention backend). Install
# `freetoken[cuda]` (or legacy `freetoken[accel]`) for the CUDA native fast path.
fi = ["flashinfer-python[cu13]==0.6.18.post1"]
# renamed from sgl-kernel at 0.4; still imports as `sgl_kernel`, so never co-install both
sgl = ["sglang-kernel==0.4.5"]
# Legacy spelling for the CUDA selection. Keep its dependencies explicit rather
# than recursively referencing this package so resolver-only checks never need
# to execute setup.py before the selected Torch runtime is installed.
accel = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "triton==3.6.0; platform_system == 'Linux'",
    "flashinfer-python[cu13]>=0.6,<0.7",
    "sglang-kernel==0.4.5",
]
# NOTE: the Marlin W4A16 NVFP4 expert-GEMM path (sm_80-99) borrows vLLM's AOT wheel
# (vllm>=0.14,<0.15), which pins transformers>=4.56,<5 and so is INCOMPATIBLE with the
# core transformers>=5.5 requirement. It is therefore not a lockable extra and is left
# out of the default resolution — install it separately (`pip install 'vllm>=0.14,<0.15'`)
# in a dedicated environment when you specifically need the Marlin path.

# uv-only provenance pins. pip ignores this section, so a ROCm source build must
# provision its matched Torch pair from the ROCm index before its editable build.
# `explicit = true` scopes each index to packages named below; without it a
# PyTorch index could shadow ordinary PyPI dependencies under uv's first-index
# strategy.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cu130", extra = "accel" },
    { index = "pytorch-rocm72", extra = "rocm" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cu130", extra = "accel" },
    { index = "pytorch-rocm72", extra = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm72", extra = "rocm" }]
triton-rocm = [{ index = "pytorch-rocm72", extra = "rocm" }]
sglang-kernel = { index = "sglang-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "sglang-cu130"
url = "https://docs.sglang.io/whl/cu130"
explicit = true

[tool.uv]
# setup.py imports Torch to build the native extensions. With a selected
# accelerator extra, uv installs that runtime Torch first, then builds this
# project in the same environment so PEP 517 cannot replace HIP Torch with a
# PyPI CUDA build in an isolated build environment.
no-build-isolation-package = ["freetoken"]
conflicts = [
    [{ extra = "cuda" }, { extra = "rocm" }],
    [{ extra = "accel" }, { extra = "rocm" }],
    [{ extra = "fi" }, { extra = "rocm" }],
    [{ extra = "sgl" }, { extra = "rocm" }],
]
[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*", "moe/configs/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
